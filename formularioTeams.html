<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitud de Pagos</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    border-top:8px solid #c00000;
}

h1{
    text-align:center;
    color:#c00000;
    margin-bottom:30px;
}

.form-group{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
    color:#c00000;
}

input,
select,
textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

input:focus,
select:focus,
textarea:focus{
    border:2px solid #c00000;
    outline:none;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.info{
    background:#fff4f4;
    border-left:5px solid #c00000;
    padding:10px;
    margin-bottom:25px;
}

#reglaCampos{
    background:#fff4f4;
    color:#c00000;
    padding:10px;
    border-radius:5px;
    margin-bottom:20px;
    font-weight:bold;
}

button{
    background:#c00000;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#990000;
}

small{
    color:#666;
}

</style>
</head>

<body>

<div class="container">

<h1>Solicitud de Pagos</h1>

<div class="info">
Por favor complete todos los campos obligatorios.
</div>

<form id="formPago">

<div class="form-group">
<label>Tipo de solicitud *</label>

<select id="tipoSolicitud" required>
    <option value="">Seleccione un tipo de solicitud</option>
    <option value="Pago de factura vencida">Pago de factura vencida</option>
    <option value="Pago internacional">Pago internacional</option>
    <option value="Pago urgente">Pago urgente de agricultores de soja, ganaderos o transportistas</option>
    <option value="Pago de factura no vencida">Pago de factura no vencida</option>
    <option value="Solicitud detalle">Solicitud detalle de pago</option>
    <option value="Reclamación de confirming">Reclamación de confirming</option>
    <option value="Solicitud justificante">Solicitud de justificante de pago</option>
    <option value="Otros">Otros</option>
</select>

</div>


<div id="reglaCampos">
Seleccione un tipo de solicitud.
</div>


<div class="form-group">
<label>Sociedad *</label>

<select id="sociedad" required>
    <option value="">Seleccione una sociedad</option>
    <option>8000</option>
    <option>8050</option>
</select>

</div>

<div class="form-group">
<label>CIF proveedor *</label>
<input type="text" id="cifProveedor" required>
</div>

<div class="form-group">
<label>CIF sociedad *</label>
<input type="text" id="cifSociedad" required>
</div>

<div class="form-group">
<label>Nombre proveedor *</label>
<input type="text" id="nombreProveedor" required>
</div>

<div class="form-group">
<label id="lblFactura">Número factura</label>
<input type="text" id="numeroFactura">
</div>

<div class="form-group">
<label id="lblImporte">Importe (€)</label>
<input type="number" step="0.01" id="importe">
</div>

<div class="form-group">
<label>Motivo</label>
<textarea id="motivo" placeholder="Indique el detalle de la solicitud"></textarea>
</div>

<div class="form-group">
<label>Adjuntos</label>

<input
type="file"
multiple
accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.doc,.docx">

<small>
Se permiten facturas, albaranes, justificantes, recibos, contratos y solicitudes.
</small>

</div>

<button type="submit">
Enviar Solicitud
</button>

</form>

</div>

<script>

const tipoSolicitud = document.getElementById("tipoSolicitud");
const numeroFactura = document.getElementById("numeroFactura");
const importe = document.getElementById("importe");
const reglaCampos = document.getElementById("reglaCampos");
const lblFactura = document.getElementById("lblFactura");
const lblImporte = document.getElementById("lblImporte");

function actualizarRegla() {

    const tipo = tipoSolicitud.value;

    numeroFactura.required = false;
    importe.required = false;

    if (tipo === "Reclamación de confirming") {

        numeroFactura.required = true;
        importe.required = true;

        lblFactura.innerHTML = "Número factura *";
        lblImporte.innerHTML = "Importe (€) *";

        reglaCampos.innerHTML =
        "⚠ Para Reclamación de confirming son obligatorios Número de factura e Importe.";

    }
    else if (tipo !== "") {

        lblFactura.innerHTML = "Número factura *";
        lblImporte.innerHTML = "Importe (€) *";

        reglaCampos.innerHTML =
        "⚠ Debe informar al menos Número de factura o Importe.";

    }
    else {

        lblFactura.innerHTML = "Número factura";
        lblImporte.innerHTML = "Importe (€)";

        reglaCampos.innerHTML =
        "Seleccione un tipo de solicitud.";
    }
}

tipoSolicitud.addEventListener("change", actualizarRegla);

document.getElementById("formPago").addEventListener("submit", async function(e){

    e.preventDefault();

    const tipo = tipoSolicitud.value;
    const factura = numeroFactura.value.trim();
    const valorImporte = importe.value.trim();

    if (tipo === "Reclamación de confirming") {

        if (factura === "" || valorImporte === "") {

            e.preventDefault();

            alert(
            "Para una Reclamación de confirming debe informar Número de factura e Importe."
            );

            return false;
        }

    } else {

        if (factura === "" && valorImporte === "") {

            e.preventDefault();

            alert(
            "Debe informar al menos Número de factura o Importe."
            );

            return false;
        }
    }

    const datos = {

    tipoSolicitud: document.getElementById("tipoSolicitud").value,
    sociedad: document.getElementById("sociedad").value,
    cifProveedor: document.getElementById("cifProveedor").value,
    cifSociedad: document.getElementById("cifSociedad").value,
    nombreProveedor: document.getElementById("nombreProveedor").value,
    numeroFactura: document.getElementById("numeroFactura").value,
    importe: document.getElementById("importe").value,
    motivo: document.getElementById("motivo").value

    };
    
    try {
    
        const respuesta = await fetch(
            "https://default3b33942ad3774149b157e39d6dc320.c3.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/02/workflows/a662d58ea75840eb8b6b86573a60540a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=_Vz42OebRqrSZqd0ql3vOgiuUNmwgT4vSxPXEFbnEYE",
            {
                method: "POST",
                headers: {
                    "Content-Type":"application/json"
                },
                body: JSON.stringify(datos)
            }
        );
    
        if(respuesta.ok){
    
            alert("Solicitud enviada correctamente");
    
            document.getElementById("formPago").reset();
    
        }else{
    
            alert("Error al guardar la solicitud");
    
        }
    
    }
    catch(error){
    
        console.error(error);
    
        alert("Error al conectar con Power Automate");
    
    }

});

actualizarRegla();

</script>

</body>
</html>
